# Multi-Obstacle Scenario
# Multiple workers and forklifts moving in the warehouse

scenario:
  name: "Multi-Obstacle"
  description: "Navigation with multiple dynamic obstacles (workers and forklifts)"
  difficulty: "medium"
  
  # Dynamic obstacles configuration
  dynamic_obstacles:
    # Worker 1 - Patrolling main aisle
    - id: 1
      type: "worker"
      classification: "worker"
      
      radius: 0.5
      height: 1.8
      mass: 70.0
      
      initial_position: [3.0, 15.0, 0.0]
      initial_velocity: [0.0, 0.0, 0.0]
      initial_orientation: [0.0, 0.0, 0.0, 1.0]
      
      motion_pattern:
        type: "linear_patrol"
        start_point: [3.0, 5.0, 0.0]
        end_point: [3.0, 25.0, 0.0]
        max_velocity: 1.0
        acceleration: 0.5
        pause_time: 3.0
        
      behavior:
        awareness_radius: 2.5
        avoidance_behavior: "predictive"
        predictability: 0.9
        
    # Worker 2 - Cross-aisle movement
    - id: 2
      type: "worker"
      classification: "worker"
      
      radius: 0.5
      height: 1.8
      mass: 75.0
      
      initial_position: [15.0, 8.0, 0.0]
      initial_velocity: [0.0, 0.0, 0.0]
      initial_orientation: [0.0, 0.0, 0.0, 1.0]
      
      motion_pattern:
        type: "waypoint_following"
        waypoints:
          - position: [5.0, 8.0, 0.0]
            dwell_time: 2.0
          - position: [25.0, 8.0, 0.0]
            dwell_time: 2.0
          - position: [25.0, 22.0, 0.0]
            dwell_time: 1.0
          - position: [5.0, 22.0, 0.0]
            dwell_time: 1.0
        loop: true
        max_velocity: 1.3
        acceleration: 0.6
        
      behavior:
        awareness_radius: 3.0
        avoidance_behavior: "reactive"
        predictability: 0.7
        
    # Forklift 1 - Loading operations
    - id: 3
      type: "forklift"
      classification: "forklift"
      
      radius: 1.0
      height: 2.5
      mass: 2000.0
      
      initial_position: [27.0, 15.0, 0.0]
      initial_velocity: [0.0, 0.0, 0.0]
      initial_orientation: [0.0, 0.0, 0.0, 1.0]
      
      motion_pattern:
        type: "loading_cycle"
        loading_points:
          - position: [27.0, 10.0, 0.0]
            operation_time: 5.0
          - position: [27.0, 20.0, 0.0]
            operation_time: 5.0
        storage_area: [22.0, 15.0, 0.0]
        max_velocity: 2.5
        acceleration: 1.0
        
      behavior:
        awareness_radius: 4.0
        avoidance_behavior: "predictive"
        predictability: 0.95  # Forklifts are very predictable
        priority: "high"  # Other obstacles should avoid forklifts
        
    # Worker 3 - Random movement (less predictable)
    - id: 4
      type: "worker"
      classification: "worker"
      
      radius: 0.5
      height: 1.8
      mass: 65.0
      
      initial_position: [12.0, 12.0, 0.0]
      initial_velocity: [0.0, 0.0, 0.0]
      initial_orientation: [0.0, 0.0, 0.0, 1.0]
      
      motion_pattern:
        type: "random_walk"
        bounds: [[8.0, 8.0], [18.0, 18.0]]
        max_velocity: 0.8
        acceleration: 0.4
        direction_change_interval: 5.0
        pause_probability: 0.2
        pause_duration: [1.0, 3.0]
        
      behavior:
        awareness_radius: 2.0
        avoidance_behavior: "simple"
        predictability: 0.4  # Less predictable
        
  # Scenario parameters
  duration: 600.0  # seconds (10 minutes)
  success_criteria:
    goal_reached_tolerance: 0.2
    time_limit: 120.0  # seconds per goal (longer due to multiple obstacles)
    collision_tolerance: 0
    near_miss_tolerance: 5  # Allow some near misses
    
  # Performance metrics to track
  metrics:
    - "path_length"
    - "time_to_goal"
    - "path_efficiency"
    - "collision_count"
    - "near_miss_count"
    - "planning_time"
    - "replanning_count"
    - "obstacle_avoidance_time"
    - "safety_override_count"
    - "emergency_stop_count"
    
  # Test goals sequence
  goal_sequence:
    - position: [28.0, 28.0, 0.0]
      timeout: 120.0
    - position: [2.0, 28.0, 0.0]
      timeout: 120.0
    - position: [28.0, 2.0, 0.0]
      timeout: 120.0
    - position: [15.0, 15.0, 0.0]
      timeout: 120.0
    - position: [2.0, 2.0, 0.0]
      timeout: 120.0