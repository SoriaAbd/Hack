# VULTR Cloud Configuration for AdaptNav
# Enhanced cloud-based training and deployment configuration

vultr_integration:
  # Cloud training infrastructure
  training:
    enabled: true
    instance_type: "vc2-24c-96gb-amd"  # High-performance GPU instance
    gpu_enabled: true
    gpu_type: "NVIDIA RTX A6000"
    region: "ewr"  # New Jersey for low latency
    
    # Distributed training configuration
    distributed_training:
      enabled: true
      worker_nodes: 4
      parameter_server_nodes: 1
      
    # Training optimization
    batch_size_multiplier: 4  # Scale up for cloud resources
    parallel_environments: 16  # Multiple simulation instances
    
  # Cloud simulation scaling
  simulation:
    enabled: true
    # Multiple simulation instances for parallel training
    instances:
      - name: "adaptnav-sim-1"
        instance_type: "vc2-8c-32gb"
        scenarios: ["benchmark_easy", "benchmark_medium"]
      - name: "adaptnav-sim-2" 
        instance_type: "vc2-8c-32gb"
        scenarios: ["benchmark_hard", "crowded"]
        
  # Real-time inference deployment
  deployment:
    enabled: true
    load_balancer: true
    auto_scaling:
      min_instances: 2
      max_instances: 10
      cpu_threshold: 70
      
  # Data storage and management
  storage:
    object_storage: true
    bucket_name: "adaptnav-training-data"
    model_versioning: true
    backup_retention_days: 30
    
  # Monitoring and analytics
  monitoring:
    enabled: true
    metrics_collection: true
    performance_dashboards: true
    alert_thresholds:
      inference_latency_ms: 100
      training_loss_plateau: 0.01
      
# Enhanced PPO training for cloud resources
ppo_cloud_training:
  # Scale up for cloud infrastructure
  total_timesteps: 10000000  # 10M timesteps (vs 1-5M local)
  parallel_envs: 16  # Multiple environments
  batch_size: 8192  # Larger batches
  learning_rate: 1e-4
  
  # Cloud-specific optimizations
  gradient_accumulation_steps: 4
  mixed_precision: true
  distributed_backend: "nccl"
  
# Cloud simulation parameters
cloud_simulation:
  physics_timestep: 0.0005  # Higher precision
  parallel_simulations: 16
  scenario_generation:
    dynamic_scenarios: true
    difficulty_progression: true
    automated_testing: true